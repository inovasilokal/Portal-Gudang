<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Gudang - Masuk</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #333; margin-bottom: 10px; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        .form-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; color: #444; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 14px; }
        .btn-primary { background-color: #007bff; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 15px; margin-top: 10px; }
        .btn-primary:hover { background-color: #0056b3; }
        .footer-link { margin-top: 20px; display: block; font-size: 13px; color: #007bff; text-decoration: none; }
        .footer-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h2>📦 Portal Gudang</h2>
        <p>Silakan masukkan data diri Anda untuk mulai meminta material.</p>
        
        <form id="formUser">
            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text" id="nama" required placeholder="Contoh: Budi Santoso">
            </div>
            
            <div class="form-group">
                <label>Departemen</label>
                <select id="departemen" required>
                    <option value="">-- Pilih Departemen --</option>
                    <option value="Proses">Proses</option>
                    <option value="Laboratorium">Laboratorium</option>
                    <option value="Mechanical">Mechanical</option>
                    <option value="Electrical">Electrical</option>
                    <option value="Komposting">Komposting</option>
                    <option value="Kantor">Kantor</option>
                </select>
            </div>
            
            <button type="submit" class="btn-primary">Lanjutkan Meminta Material</button>
        </form>

        <a href="login.html" class="footer-link">🔑 Log in untuk masuk ke dashboard gudang (Staff/KTU)</a>
    </div>

    <script>
        document.getElementById('formUser').addEventListener('submit', function(e) {
            e.preventDefault();
            localStorage.setItem('user_nama', document.getElementById('nama').value);
            localStorage.setItem('user_departemen', document.getElementById('departemen').value);
            window.location.href = 'user.html';
        });
    </script>
</body>
</html>
