<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Portal Pengawasan PKS & Gudang</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #f4f6f9; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }
        
        .card-login { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
            width: 100%; 
            max-width: 400px; 
        }
        
        h2 { color: #333; margin-top: 0; margin-bottom: 5px; text-align: center; font-size: 22px; }
        .subtitle { text-align: center; color: #666; font-size: 13px; margin-bottom: 25px; }
        .form-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 13px; color: #444; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; background: #fafafa; }
        input:focus { border-color: #007bff; outline: none; background: #fff; }
        
        .btn-primary { background-color: #007bff; color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; transition: background 0.2s; }
        .btn-primary:hover { background-color: #0056b3; }
        
        /* Tombol saat diproses: Berubah merah dan terkunci (Anti Double-Click) */
        .btn-primary:disabled { background: #dc3545 !important; color: white !important; cursor: not-allowed; opacity: 0.9; }

        .back-link { display: block; text-align: center; margin-top: 20px; font-size: 13px; color: #666; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="card-login">
        <h2>🔑 Login Staff, KTU & Manajer</h2>
        <p class="subtitle">Portal Pengawasan Terpusat PKS & Gudang</p>
        
        <form id="formLogin" onsubmit="handleLoginSubmit(event, this)">
            <div class="form-group">
                <label>Email Akses</label>
                <input type="email" id="email" required placeholder="nama@perusahaan.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-primary" id="btnLoginSubmit">Masuk ke Sistem</button>
        </form>
        <a href="index.html" class="back-link">← Kembali ke Beranda</a>
    </div>

    <script>
        const urlAPI = "https://script.google.com/macros/s/AKfycbzDo3Fhl54G_HfiiOSgWe1PswfpyNG5mjEMiFeWARTXPILWDTcJGuFSejwA72EB3QLj/exec";
        let isLoggingIn = false;

        function handleLoginSubmit(e, formEl) {
            e.preventDefault();
            if (isLoggingIn) return;

            const submitBtn = document.getElementById('btnLoginSubmit');
            const originalText = submitBtn.textContent;

            // Kunci tombol, ubah warna jadi merah, cegah double-click
            isLoggingIn = true;
            submitBtn.disabled = true;
            submitBtn.textContent = "⏳ Memproses Login...";

            const payload = {
                action: "login",
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value
            };

            fetch(urlAPI, { method: 'POST', body: JSON.stringify(payload) })
            .then(res => res.json())
            .then(response => {
                if (response.status === "success") {
                    // Simpan sesi login ke localStorage
                    localStorage.setItem('login_role', response.role);
                    localStorage.setItem('login_dept', response.departemen);
                    localStorage.setItem('login_email', response.email);
                    
                    const cleanRole = response.role.toLowerCase().trim();
                    
                    // Routing otomatis berdasarkan role
                    if (cleanRole === 'ktu') {
                        window.location.href = 'ktu.html';
                    } else {
                        window.location.href = 'user.html';
                    }
                } else {
                    alert(response.message);
                }
            })
            .catch(err => {
                alert('Terjadi kesalahan koneksi.');
                console.error(err);
            })
            .finally(() => {
                // Buka kembali tombol jika terjadi error atau gagal login
                isLoggingIn = false;
                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
            });
        }
    </script>
</body>
</html>
